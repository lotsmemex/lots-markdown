[package]
name = "lots-markdown-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Shared Markdown renderer for Lots Markdown"
publish = false

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindings"]

[features]
bindings = ["uniffi/cli"]

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
pulldown-cmark-escape = "0.11"
uniffi = "0.32.2"

[dev-dependencies]
scraper = "0.24"
